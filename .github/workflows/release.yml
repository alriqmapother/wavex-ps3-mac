name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build universal app
        run: cd WaveX && ./Scripts/build-app.sh
      - name: Package DMG
        run: cd WaveX && ./Scripts/make-dmg.sh "${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: Wave-X-dmg
          path: WaveX/build/*.dmg
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: WaveX/build/*.dmg
          body_path: WaveX/RELEASE_NOTES.md
